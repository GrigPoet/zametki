<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Заметки</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 420px; margin: 60px auto;">
      <h1>Вход</h1>
      <form id="login-form">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <input id="username" placeholder="Логин" required minlength="3" maxlength="50" autocomplete="username">
          <input id="password" type="password" placeholder="Пароль" required minlength="6" autocomplete="current-password">
          <button type="submit">Войти</button>
        </div>
        <p class="error" id="error"></p>
        <p class="muted">Нет аккаунта? <a href="/static/register.html">Зарегистрироваться</a></p>
      </form>
    </div>
  </div>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
