<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Регистрация — Заметки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="cursor-glow" aria-hidden="true"></div>

  <main class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="3" y="3" width="26" height="26" rx="8" stroke="currentColor" stroke-width="2"/>
            <path d="M11 21V11l10 10V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Заметки</strong>
          <small>рабочее пространство</small>
        </span>
      </div>

      <p class="eyebrow">Новый аккаунт</p>
      <h1>Регистрация</h1>
      <p class="auth-sub muted">Придумайте логин и пароль — всё останется только у вас.</p>

      <form id="register-form" class="auth-form">
        <input id="username" placeholder="Логин (3–50 символов)" required minlength="3" maxlength="50" autocomplete="username">
        <input id="password" type="password" placeholder="Пароль (минимум 6)" required minlength="6" autocomplete="new-password">
        <button type="submit">Зарегистрироваться</button>
        <p class="error" id="error"></p>
      </form>

      <p class="auth-switch muted">Уже есть аккаунт? <a href="/static/login.html">Войти</a></p>
    </div>
  </main>

  <script type="module" src="/static/js/register.js"></script>
</body>
</html>
